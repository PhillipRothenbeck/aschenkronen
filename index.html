function makeNoise(r,n){const g=new Float32Array((n+1)*(n+1));for(let i=0;i<g.length;i++)g[i]=r();
  return(x,y)=>{x=clamp(x,0,n-.001);y=clamp(y,0,n-.001);const xi=x|0,yi=y|0,xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=n+1;
    const a=g[yi*w+xi],b=g[yi*w+xi+1],c=g[(yi+1)*w+xi],d=g[(yi+1)*w+xi+1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(ns,x,y){return ns[0](x*4,y*4)*.55+ns[1](x*9,y*9)*.3+ns[2](x*19,y*19)*.15;}

    const N=()=>[makeNoise(r,20),makeNoise(r,20),makeNoise(r,20)];

function provYield(i){
  const p=S.provs[i],m=MAP.provs[i],T=TERR[m.terrain],f=S.facs[p.owner];
  const[pe,bu,no]=p.pop,rl=ruler(f);
  const eff=(1+(p.gov?p.gov.ste:0)*.03)*(1-p.unrest/250);
  const y={gold:0,grain:0,timber:0,stone:0,iron:0,cloth:0,mana:0,food:0,clothNeed:0};
  const vy=villYield(i,p.owner);y.prestige=vy.prestige*eff;y.grain=(pe/55+vy.grain+(m.coastal?2:0))*eff;
  y.timber=vy.timber*eff;y.stone=vy.stone*eff;y.iron=vy.iron*eff;y.cloth=vy.cloth*eff;
  y.mana=(lvl(p,'tower')*3*(f&&f.race==='undead'?1.5:1)+(T.mana||0))*eff;
  const tax=f?TAXP[f.tax].m:1;
  y.gold=(pe*.02+bu*.1+no*.3)*(1+stat(rl,'ste')*.04)*eff*tax*(1+tierBonus(cityTier(p)).gold);
  if(lvl(p,'market')){const mk=f&&f.race==='human'?1.25:1;y.gold+=lvl(p,'market')*(3+bu*.03)*mk;for(const n of m.adj)if(S.provs[n].owner===p.owner&&lvl(S.provs[n],'market'))y.gold+=3*mk;}
  y.gold+=vy.gold*eff;y.mana+=vy.mana*eff;
  const foodMul=f?RACES[f.race].food:1;
  y.food=(pe+bu+no)/40*(foodMul>0?1:0);
  if(f&&f.race==='undead'){y.food=(bu+no)/40;} // only the living servants eat
  y.clothNeed=bu/25+no/8;
  return y;
}
function upkeep(f){const o={};const add=(t,gar)=>{for(const[k,v]of Object.entries(unitUpkeep(t,f.id,gar)))o[k]=(o[k]||0)+v;};
  for(const a of S.armies)if(a.owner===f.id)for(const u of a.units)add(u.t,false);
  for(const i of owned(f.id))if(i!==f.cap)for(const u of S.provs[i].gar)if(hasUnit(f.race,u.t)||UNITS[u.t])add(u.t,true);
  return o;}
function project(f){
  const t={gold:0,grain:0,timber:0,stone:0,iron:0,cloth:0,mana:0,prestige:0};
  for(const i of owned(f.id)){const y=provYield(i),p=S.provs[i];t.gold+=y.gold;t.grain+=y.grain-y.food;t.timber+=y.timber;t.stone+=y.stone;t.iron+=y.iron;t.cloth+=y.cloth-y.clothNeed;t.mana+=y.mana;
    t.prestige+=tierBonus(cityTier(p)).fame+lvl(p,'manor')+lvl(p,'shrine')*.3+p.pop[2]/80+(y.prestige||0);}
  S.provs.forEach((pp,i)=>{if(pp.owner===f.id||!pp.vo||!pp.vo.includes(f.id))return;const vy=villYield(i,f.id);for(const k in vy)t[k]+=vy[k];});
  const u=upkeep(f);for(const k in u)t[k]-=u[k];
  const rl=ruler(f);t.prestige+=tsum(rl,'prest');t.mana+=tsum(rl,'mana');
  for(const tr of S.tribs){if(tr.from===f.id)t.gold-=tr.amt;if(tr.to===f.id)t.gold+=tr.amt;}
  t.gold+=tradeIncome(f.id);
  return t;
}
function econTurn(f){f.mk={};
  if(f.race==='undead'){let warned=false;for(const a of S.armies){if(a.owner!==f.id||a.units.some(u=>u.t==='mage'))continue;
    for(const u of a.units)u.str=Math.max(0,u.str-15);a.units=a.units.filter(u=>u.str>1);
    if(f.player&&!warned){warned=true;log('Ein Heer ohne Nekromanten zerfällt (−15 Stärke pro Runde). Hebe einen Nekromanten aus!','bad',true);}}cleanArmies();}
  const bal=project(f);
  for(const k of RES)f.res[k]+=(bal[k]||0)*(!f.player&&(bal[k]||0)>0?dif().ai*(f.minor?.6:1):1);
  f.prestige+=bal.prestige;
  const famine=f.res.grain<0,clothShort=f.res.cloth<0,broke=f.res.gold<0;
  if(famine)log(`${f.name} leidet Hunger.`,'bad',f.player);
  const unpaid=Object.keys(econ(f.id).up).filter(k=>k!=='grain'&&f.res[k]<0);
  if(unpaid.length||(famine&&econ(f.id).up.grain)){
    if(f.player)log(`Der Sold bleibt aus (es fehlt ${[...unpaid,...(famine&&econ(f.id).up.grain?['grain']:[])].map(k=>RES_N[k]).join(' und ')}). Die Heere verlieren Kampfkraft, Soldaten desertieren.`,'bad',true);
    for(const a of S.armies)if(a.owner===f.id)for(const u of a.units)u.str=Math.max(5,u.str-10);
    const a=S.armies.filter(x=>x.owner===f.id&&x.units.length).sort((x,y)=>y.units.length-x.units.length)[0];if(a)a.units.pop();cleanArmies();}
  for(const k of RES)if(f.res[k]<0)f.res[k]=0;
  const rl=ruler(f);
  for(const i of owned(f.id)){
    const p=S.provs[i],m=MAP.provs[i],T=TERR[m.terrain];
    let[pe,bu,no]=p.pop;const tot=pe+bu+no;
    const cap=T.cap+(m.coastal?200:0)+vsum(p,'farm')*120+(p.vk?p.vk.length:0)*60+tierBonus(cityTier(p)).cap;
    if(!famine)pe+=pe*.025*(1-tot/cap)+2;else pe*=.95;
    if(lvl(p,'market')&&!clothShort&&bu<lvl(p,'market')*120){const mv=pe*.015;pe-=mv;bu+=mv;}
    if(lvl(p,'manor')&&!clothShort&&no<lvl(p,'manor')*25){const mv=bu*.02;bu-=mv;no+=mv;}
    if(clothShort){bu*=.97;no*=.96;}
    p.pop=[Math.max(20,pe),Math.max(0,bu),Math.max(0,no)];
    const isCap=i===f.cap;
    let tgt=12-tierBonus(cityTier(p)).calm-lvl(p,'shrine')*8-vsum(p,'abbey')*4-(p.vk||[]).filter((k,j)=>k==='abbey'&&p.vo[j]===p.owner).length*3-Math.min(p.gar.length,5)*2.5+p.conq+TAXP[f.tax].u+(famine?25:0)+(clothShort&&bu>20?10:0)+(p.gov?(50-p.gov.loy)/4:-8)+tsum(rl,'unrest')+(broke?10:0);
    if(S.armies.some(a=>a.owner===f.id&&a.prov===i))tgt-=6;
    p.unrest=clamp(p.unrest+(tgt-p.unrest)*.25,0,100);
    p.conq=Math.max(0,p.conq-2);
    if(p.gov){const t=55+clamp(f.prestige/15,-20,25)+stat(rl,'int')*2-p.unrest/3+tsum(rl,'loy');p.gov.loy=clamp(p.gov.loy+(t-p.gov.loy)*.1+(R()*4-2),0,100);}
    // garrison
    const gmax=1+lvl(p,'walls')*2+lvl(p,'barracks')+tierBonus(cityTier(p)).gar;
    {const nt=cityTier(p);if(p.tier&&nt>p.tier){f.prestige+=5*(nt-1);ui.dirtyBase=true;if(f.player)log(`${m.city} in ${m.name} ist zur ${TIER[nt-1].n} gewachsen! (+${5*(nt-1)} Ruhm)`,'good',true);}p.tier=nt;}
    for(const u of p.gar)u.str=Math.min(100,u.str+12);
    if(p.gar.length<gmax&&chance(.5))p.gar.push({t:p.gar.length%2?'bow':'spear',str:50});
    while(p.gar.length>gmax)p.gar.pop();
    // trouble
    if(!isCap&&p.unrest>65&&chance((p.unrest-65)/80)){
      if(S.armies.some(a=>a.owner===f.id&&a.prov===i)){p.unrest-=20;log(`Truppen schlugen einen Aufstand in ${m.name} nieder.`,'',f.player);}
      else revolt(i,'erhebt sich');}
    else if(p.gov&&p.gov.loy<15&&chance(.12))defect(i);
  }
  // army healing in friendly land
  for(const a of S.armies)if(a.owner===f.id&&friendly(f.id,S.provs[a.prov].owner))for(const u of a.units)u.str=Math.min(100,u.str+10);
}
function revolt(i,why){const p=S.provs[i],old=p.owner;const f=S.facs[old];
  if(p.vo)p.vo=p.vo.map(o=>o===old?-1:o);p.owner=-1;p.gar=mkGar('wild',2+Math.floor(p.unrest/25),70,90);p.gov=null;p.unrest=30;p.siege=0;
  log(`${MAP.provs[i].name} ${why} und wirft die Herrschaft von ${f.name} ab!`,'bad',old===0);f.prestige-=12;checkFacAlive(old);}
function defect(i){const p=S.provs[i],old=p.owner,m=MAP.provs[i];
  const cands=[...new Set(m.adj.map(n=>S.provs[n].owner))].filter(o=>o>=0&&o!==old&&!friendly(o,old));
  if(cands.length&&chance(.6)){const to=pick(cands);const g=p.gov.name;if(p.vo)p.vo=p.vo.map(o=>o===old?to:o);p.owner=to;p.gov=mkGov(to);p.gar=[];p.unrest=30;p.siege=0;
    log(`Statthalter ${g} von ${m.name} verrät ${S.facs[old].name} und beugt das Knie vor ${S.facs[to].name}.`,'bad',old===0||to===0);
    S.facs[old].prestige-=10;checkFacAlive(old);}
  else revolt(i,`folgt seinem verräterischen Statthalter ${p.gov.name}`);}
function neutralTurn(){for(const p of S.provs)if(p.owner<0){for(const u of p.gar)u.str=Math.min(90,u.str+5);if(p.gar.length<2&&chance(.1))p.gar.push({t:'spear',str:50});}}

/* building */
function bCost(k,p,f){const L=lvl(p,k);const c={};for(const[r,v]of Object.entries(BLD[k].cost))c[r]=v*(L+1);return raceCost(c,f?f.race:'human');}
/* CITY TIERS: a town grows with its buildings, burghers and nobles, and every tier pays back:
   more tax, a higher population cap, extra building plots, a bigger garrison and calmer streets. */
const TIER=[{n:'Weiler'},{n:'Marktflecken'},{n:'Stadt'},{n:'Großstadt'},{n:'Metropole'}],TIER_AT=[0,1.5,5,9.5,15];
function cityScore(p){let s=0;for(const[k,v]of Object.entries(p.b||{}))s+=k==='walls'?v*.5:v;return s+((p.pop[1]||0)+(p.pop[2]||0)*3)/200;}
function cityTier(p){const s=cityScore(p);let t=1;for(let i=1;i<TIER_AT.length;i++)if(s>=TIER_AT[i])t=i+1;return t;}
const tierBonus=t=>({gold:.12*(t-1),cap:200*(t-1),slots:Math.max(0,t-2),gar:(t>=3?1:0)+(t>=5?1:0),calm:1.5*(t-1),fame:.15*(t-1)});
function tierTxt(t){const b=tierBonus(t);if(t<2)return'Noch keine Boni. Baue Gebäude und lass Bürger und Adlige zuziehen.';
  return[`+${Math.round(b.gold*100)} % Steuern`,`+${b.cap} Bevölkerungsgrenze`,b.slots?`+${b.slots} Bauplatz${b.slots>1?'e':''}`:'',b.gar?`+${b.gar} Garnison`:'',`−${String(b.calm).replace('.',',')} Unruhe`,`+${String(b.fame).replace('.',',')} Ruhm pro Saison`].filter(Boolean).join(' · ');}
function devUsed(p){let s=0;for(const[k,v]of Object.entries(p.b))if(!BLD[k].free)s+=v;return s;}
function devMax(p){return 3+Math.floor((p.pop[0]+p.pop[1]+p.pop[2])/250)+tierBonus(cityTier(p)).slots;}
function canBuild(f,i,k){const p=S.provs[i],m=MAP.provs[i],B=BLD[k];const c=bCost(k,p,f);
  if(p.owner!==f.id)return{ok:false,why:'Nicht dein Besitz',c};
  const max=B.max||3;if(lvl(p,k)>=max)return{ok:false,why:'Voll ausgebaut',c};
  if(B.need&&!B.need(m))return{ok:false,why:B.needTxt,c};
  if(B.has&&!B.has(f.race))return{ok:false,why:B.needTxt,c};
  if(B.req&&lvl(p,B.req)<(B.reqL||1))return{ok:false,why:B.needTxt,c};
  if(k==='lair'&&owned(f.id).some(j=>lvl(S.provs[j],'lair')))return{ok:false,why:'Nur einer pro Reich',c};
  if(!B.free&&devUsed(p)>=devMax(p))return{ok:false,why:'Kein Platz: Bevölkerung vergrößern',c};
  if(S.armies.some(a=>a.prov===i&&hostile(f.id,a.owner)))return{ok:false,why:'Wird belagert',c};
  if(!canAfford(f,c))return{ok:false,why:'Zu teuer',c};
  return{ok:true,c};}
function build(f,i,k){const r=canBuild(f,i,k);if(!r.ok)return false;pay(f,r.c);const t0=cityTier(S.provs[i]);S.provs[i].b[k]=lvl(S.provs[i],k)+1;
  {const t1=cityTier(S.provs[i]);S.provs[i].tier=t1;ui.dirtyBase=true;if(f.player&&t1>t0){f.prestige+=5*(t1-1);log(`${MAP.provs[i].city} ist zur ${TIER[t1-1].n} gewachsen! (+${5*(t1-1)} Ruhm)`,'good');toast(`${MAP.provs[i].city} ist jetzt ${TIER[t1-1].n==='Stadt'?'eine':'ein'} ${TIER[t1-1].n}!`);}}
  if(k==='lair'&&f.player)log(`${RACES[f.race].lair} in ${MAP.provs[i].name} errichtet. Nun können Legenden gezüchtet werden.`,'good');return true;}
function bName(k,f){return k==='lair'?RACES[f?f.race:'human'].lair:BLD[k].n;}
function bEffect(k,m,f){const T=TERR[m.terrain];switch(k){
  case'farm':return`+${T.grain+(m.coastal?2:0)} Getreide pro Stufe`;case'lumber':return`+${T.timber} Holz pro Stufe`;
  case'quarry':return`+${T.stone} Stein pro Stufe`;case'mine':return T.iron?`+${T.iron} Eisen pro Stufe`:'Hier gibt es kein Erz';
  case'loom':return`+${T.cloth} Tuch pro Stufe`;case'market':return'Bürgersteuern, lässt Bauern aufsteigen, +3 Gold je benachbartem Markt';
  case'manor':return'Lässt Bürger zu Adligen aufsteigen. +1 Ruhm pro Saison';case'shrine':return'Beruhigt die Unruhe, etwas Ruhm';
  case'tower':return'+3 Mana pro Stufe. Schaltet Magier frei';case'barracks':return'Stufe 1: Schwertkämpfer. Stufe 2: Elite und Feuerwaffen. Jede Stufe: 10 % billigere Truppen, größere Garnison';case'stable':return'Stufe 1: leichte Reiter. Stufe 2: schwere Reiter';case'workshop':return'Stufe 1: Belagerungsgerät. Stufe 2: Salvengeschütze';

/* recruiting */
function unitCost(f,t,i){const p=S.provs[i],U=US(t,f.id),rc=1;const c={};
  for(const[k,v]of Object.entries(U.cost))c[k]=Math.round(v*(k==='gold'?rc*(1-.1*lvl(p,'barracks')):1));
  if(f.race==='undead'&&c.iron){c.mana=(c.mana||0)+Math.ceil(c.iron/2);delete c.iron;}
  return c;}
function canRecruit(f,t,i){const p=S.provs[i],U=US(t,f.id),c=unitCost(f,t,i);
  if(!hasUnit(f.race,t))return{ok:false,why:'Nicht im Armeebuch',c};
  if(p.owner!==f.id)return{ok:false,why:'Nur in deinen Provinzen',c};
  if(U.need&&lvl(p,U.need)<(U.needL||1))return{ok:false,why:`Braucht: ${bName(U.need,f)}${(U.needL||1)>1?' Stufe '+U.needL:''}`,c};
  if(S.armies.some(a=>a.prov===i&&hostile(f.id,a.owner)))return{ok:false,why:'Wird belagert',c};
  if(!canAfford(f,c))return{ok:false,why:'Zu teuer',c};return{ok:true,c};}
function recruit(f,t,i){const r=canRecruit(f,t,i);if(!r.ok)return null;pay(f,r.c);
  let a=S.armies.find(x=>x.owner===f.id&&x.prov===i&&x.units.length<10&&!x.siege);
  if(!a)a=newArmy(f.id,i);a.units.push({t,str:100});return a;}

/* ============================================================
   COMBAT
   ============================================================ */
function uPow(u,owner){const U=US(u.t,owner);return(U.atk+U.def)*(U.regen?1.15:1)*u.str/100;}
function genMar(a){if(!a)return 0;const f=S.facs[a.owner];return(a.gen?a.gen.mar:0)+Math.floor(stat(ruler(f),'mar')/2);}
function armyPow(a){return a.units.reduce((s,u)=>s+uPow(u,a.owner),0)*(1+.04*genMar(a));}
function garPow(p,wm=1){return p.gar.reduce((s,u)=>s+uPow(u,p.owner),0)*wm;}
function defPowFor(n,me){let s=0;const p=S.provs[n];for(const a of S.armies)if(a.prov===n&&hostile(me,a.owner))s+=armyPow(a);
  if(hostile(me,p.owner))s+=lvl(p,'walls')?garPow(p)*.25:garPow(p)*TERR[MAP.provs[n].terrain].cover;return s;}
function facPow(id){let s=0;for(const a of S.armies)if(a.owner===id)s+=armyPow(a);for(const i of owned(id))s+=garPow(S.provs[i])*.5;return s;}
function wallMult(a,p){const w=lvl(p,'walls');if(!w)return 1;let m=1+.3*w;if(p.siege>=w*2)m=1+(m-1)*.3;if(a&&a.units.some(u=>isArty(u.t)))m=1+(m-1)*.5;return m;}
function dmg(u,t,o){const U=US(u.t,o.ao),T=US(t.t,o.do);
  let a=U.atk*(U.vs&&U.vs[t.t]||1)*(1+.04*(o.mar||0))*(o.flank?1.25:1)*(o.charge?(U.charge||1.3):1)*(o.high?1.2:1)*(o.weak?.5:1);
  let d=T.def*(U.pierce?.7:1)*(U.arcane?1:(o.cover||1)*(o.wall||1));
  a*=((RACE_VS[raceOf(o.ao)]||{})[raceOf(o.do)]||1)*(U.arcane&&raceOf(o.do)==='dwarf'?.5:1)*(o.unb?.75:1);
  return 30*a/(a+d)*Math.pow(Math.max(u.str,1)/100,.6)*(.8+R()*.4)*(raceOf(o.do)==='dwarf'?.85:1);}
function est(u,t,ao,dO){const U=US(u.t,ao),T=US(t.t,dO);const a=U.atk*(U.vs&&U.vs[t.t]||1)*((RACE_VS[raceOf(ao)]||{})[raceOf(dO)]||1)*(U.arcane&&raceOf(dO)==='dwarf'?.5:1),d=T.def*(U.pierce?.7:1);return a/(a+d);}
/* AUTO-RESOLVE tuning. race = field strength per people, calibrated over mixed armies of equal gold
   (human 48 %, dwarf 54 %, orc 48 %, undead 45 % after tuning). Counters at equal gold (humans): sword beats spear 75 %,
   horde 68 %, archers and artillery ~100 %; spears beat cavalry ~100 %; cavalry beats archers, artillery and mages ~100 %. */
const AR={minFront:3,frontMul:1,szPow:1,race:{human:1.12,dwarf:.67,orc:1.25,undead:.96}};
function autoResolve(A,D,ctx){
  const rtA=RACES[raceOf(ctx.ao)].rout,rtD=RACES[raceOf(ctx.do)].rout,G=ctx.gar||new Set();
  const aliveA=()=>A.filter(u=>u.str>=rtA),aliveD=()=>D.filter(u=>u.str>=rtD);
  const cover=TERR[MAP.provs[ctx.prov].terrain].cover;
  const und=o=>raceOf(o)==='undead',hasN=(L,rt)=>L.some(u=>u.t==='mage'&&u.str>=rt);
  const had={a:und(ctx.ao)&&hasN(A,rtA),d:und(ctx.do)&&hasN(D,rtD)};
  const tgt=(u,foes,ao,dO)=>{let best=null,bs=-1;for(const f of foes){const s=est(u,f,ao,dO)+R()*.25;if(s>bs){bs=s;best=f;}}return best;};
  // quality over mass: a company's weight grows with its worth, only a frontage of melee companies fights at once,
  // and each side has some fortune for the whole battle
  const sz=(u,o)=>Math.sqrt(Math.max(6,(US(u.t,o).cost.gold||20))/25)*(US(u.t,o).big?1.4:1);
  const luck={[ctx.ao]:.85+R()*.3};luck[ctx.do]=ctx.do===ctx.ao?luck[ctx.ao]:.85+R()*.3;
  const front=(list,foes,o,round)=>{if(round===0)return list;const ml=list.slice();
    const F=Math.max(AR.minFront,Math.min(ml.length,Math.ceil(foes.length*AR.frontMul)));for(let i=ml.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[ml[i],ml[j]]=[ml[j],ml[i]];}return ml.slice(0,F);};
  for(let round=0;round<13;round++){const a=aliveA(),d=aliveD();if(!a.length||!d.length)break;const hits=[];
    const strike=(list,foes,ao,dO,mar,isAtt,hd)=>{for(const u of front(list,foes,ao,round)){const U=US(u.t,ao);if(round===0&&!U.ranged)continue;
      const reach=U.ranged?foes:(foes.some(f=>f.t!=='mage')?foes.filter(f=>f.t!=='mage'):foes);const t=tgt(u,reach,ao,dO);let m=.7*(U.ranged?1.5/(U.cd||1.5):1.1/(U.cd||1.1));
      if(round===0)m*=(U.rng||150)/170;
      const unb=und(ao)&&!hd&&u.t!=='mage'&&!G.has(u);
      hits.push([t,dmg(u,t,{ao,do:dO,mar,unb,cover:isAtt?1+(cover-1)*.5:1,wall:isAtt?ctx.wall:1,charge:round===1&&!!U.charge})*m*Math.pow(sz(u,ao)/sz(t,dO),AR.szPow)*luck[ao]*(AR.race[raceOf(ao)]||1)]);}};
    strike(a,d,ctx.ao,ctx.do,ctx.am,true,had.a);strike(d,a,ctx.do,ctx.ao,ctx.dm,false,had.d);
    for(const[t,h]of hits)t.str=Math.max(0,t.str-h);
    for(const[list,o]of[[A,ctx.ao],[D,ctx.do]])for(const u of list){const U=US(u.t,o);if(U.regen&&u.str>0)u.str=Math.min(100,u.str+U.regen*2);}
    for(const[list,hd,rt]of[[A,had.a,rtA],[D,had.d,rtD]])if(hd&&!hasN(list,rt))for(const u of list)if(u.t!=='mage'&&!G.has(u))u.str=Math.max(0,u.str-30);}

function family(f){const r=ruler(f);if(!r)return[];const ids=new Set([r.id]);if(r.spouse)ids.add(r.spouse);r.kids.forEach(k=>ids.add(k));f.kin.forEach(k=>ids.add(k));return[...ids].map(i=>S.chars[i]).filter(c=>c&&c.alive);}
function deathChance(c,f){const life=RACES[c.race].life;if(!life)return 0;const age=c.age/life;
  let p=age<5?.02:age<40?.005:.005+Math.pow((age-40)/38,3)*.5;return p*(1+tsum(c,'health'));}
async function yearTick(){
  for(const f of S.facs){if(!f.alive)continue;
    for(const c of family(f)){c.age++;
      if(f.player&&c.age===16&&c.id!==f.ruler&&ruler(f).kids.includes(c.id))await comingOfAge(c);
      if(chance(deathChance(c,f)))await kill(c,f,'Alter und Krankheit');}}}
async function kill(c,f,how){if(!c.alive)return;
  if(c.race==='undead'&&f.ruler===c.id){f.prestige-=15;if(f.player)log(`${c.name} wurde vernichtet (${how}), formt sich aber aus der Phylakterie neu. Der Ruhm leidet.`,'bad',true);return;}c.alive=false;
  if(c.spouse&&S.chars[c.spouse]){S.chars[c.spouse].spouse=null;}
  if(f.player)log(`${c.name} ist im Alter von ${c.age} Jahren gestorben (${how}).`,'bad',true);
  if(f.ruler===c.id)await succeed(f,c);}
function findHeir(f,old){const k=old.kids.map(i=>S.chars[i]).filter(c=>c&&c.alive).sort((a,b)=>b.age-a.age);if(k.length)return k[0];
  const kin=f.kin.map(i=>S.chars[i]).filter(c=>c&&c.alive).sort((a,b)=>b.age-a.age);return kin[0]||null;}
async function succeed(f,old){const h=findHeir(f,old);
  if(!h){if(f.player){S.over=true;await gameOver(false,`${old.name} starb ohne lebenden Erben. Die Linie von ${f.name} endet, und das Reich zerfällt unter zankenden Vasallen.`);return;}
    const n=mkChar({race:f.race,age:ri(25,40),house:pick(HOUSES),fac:f.id});randTrait(n,2);f.ruler=n.id;f.kin=[];log(`Eine neue Dynastie ergreift den Thron von ${f.name}.`);return;}
  f.kin=[...old.kids,...f.kin].filter(i=>i!==h.id&&S.chars[i]&&S.chars[i].alive);
  f.ruler=h.id;f.prestige*=.92;
  for(const i of owned(f.id))if(S.provs[i].gov)S.provs[i].gov.loy-=10;
  if(f.player){log(`${h.name} erbt den Sitz von ${f.name}.`,'',true);
    await ask({art:'crown',eyebrow:'Erbfolge',title:`${old.name} ist tot`,body:`<p class="flav">Die Glocken läuten in ${esc(MAP.provs[f.cap].name)}. ${esc(old.name)} wird in der Gruft unter der Burg beigesetzt.</p><p>${esc(h.name)} (${h.age} Jahre) übernimmt den Sitz.${h.age<16?' Bis zur Volljährigkeit herrscht ein Regent, und die Fähigkeiten zählen bis dahin nur zur Hälfte.':''} Die Treue der Statthalter sinkt, während sie den neuen Herrscher abschätzen.</p>`,buttons:[{label:'Lang lebe die neue Herrschaft',value:1,pri:true}]});}
  else if(chance(.5))log(`${old.name} von ${f.name} ist gestorben. ${h.name} folgt nach.`);}
function births(){for(const f of S.facs){if(!f.alive||f.race==='undead')continue;const r=ruler(f);if(!r||!r.spouse)continue;const sp=S.chars[r.spouse];if(!sp||!sp.alive)continue;
  const mom=r.female?r:sp,lim=44*RACES[f.race].life;if(mom.age<16*RACES[f.race].life||mom.age>lim||r.kids.length>=6)continue;
  if(chance(f.race==='orc'?.1:.06)){const c=mkChar({race:f.race,age:0,female:chance(.5),house:r.house,fac:f.id,mar:ri(1,8),ste:ri(1,8),int:ri(1,8)});if(chance(.08))c.traits.push(f.race==='human'?'dragon':'witch');
    r.kids.push(c.id);sp.kids.push(c.id);if(f.player)log(`${r.name} wurde ein Kind geboren: ${c.name}.`,'good');}}}
async function comingOfAge(c){
  const v=await ask({art:'u_sword',eyebrow:'Volljährigkeit',title:`${c.name} wird sechzehn`,body:`<p class="flav">Die Zeit der Holzschwerter ist vorbei.</p><p>Wähle, wo ${esc(c.name)} die letzten Jahre der Erziehung verbracht hat.</p>`,
    buttons:[{label:'Bei einem Waffenmeister',tip:'+2 Kriegskunst, wird vielleicht Tapfer',value:'mar'},{label:'Bei den Burgverwaltern',tip:'+2 Verwaltung, wird vielleicht Gewieft',value:'ste'},{label:'Bei Meisterspionen und Heckenhexen',tip:'+2 Intrige, wird vielleicht Listig oder Hexengezeichnet',value:'int'}]});
  c[v]+=2;const tr={mar:'brave',ste:'shrewd',int:chance(.5)?'cunning':'witch'}[v];if(chance(.5)&&!c.traits.includes(tr))c.traits.push(tr);
  log(`${c.name} ist volljährig geworden.`,'good');}

async function randomEvent(){

    kin:family(f).find(x=>x.id!==r.id&&x.id!==r.spouse&&x.age>=16&&!r.kids.includes(x.id))||null,
    heir:findHeir(f,r),sp:r.spouse?S.chars[r.spouse]:null,
    rival:pick(S.facs.filter(g=>g.alive&&g.id!==0&&!(rel(0,g.id)||{}).ally)),
    govs:mine.map(i=>S.provs[i]).filter(p=>p.gov).sort(()=>R()-.5),
    all:fn=>mine.forEach(i=>{fn(S.provs[i]);S.provs[i].unrest=clamp(S.provs[i].unrest,0,100);})};

  const pool=EVENTS.filter(e=>!e.cond||e.cond(c));let tot=pool.reduce((s,e)=>s+e.w,0),x=R()*tot,ev=pool[0];

    buttons:ev.ch.map((h,i)=>({label:typeof h.l==='function'?h.l(c):h.l,tip:h.tip,value:i,disabled:h.ok&&!h.ok(c)}))});

  c.p.unrest=clamp(c.p.unrest,0,100);for(const p of c.govs)p.gov.loy=clamp(p.gov.loy,0,100);
  log(`${ev.t}: ${typeof ev.ch[idx].l==='function'?ev.ch[idx].l(c):ev.ch[idx].l}.`);}

async function endTurn(){
  if(ui.busy||S.over)return;ui.busy=true;setBusy(true);ui.selArmy=null;S.imp=[];
  try{
    for(const f of S.facs)if(!f.player&&f.alive){await aiTurn(f);if(S.over)return;}
    sieges();raids();tradeTick();
    for(const f of S.facs)if(f.alive)econTurn(f);
    neutralTurn();births();
    for(const tr of S.tribs){const a=S.facs[tr.from],b=S.facs[tr.to];}
    S.turn++;
    if(S.turn%4===0)await yearTick();if(S.over)return;
    diploTick();
    await processPending();
    if(S.turn>2&&chance(.33))await randomEvent();if(S.over)return;
    for(const a of S.armies)a.moved=false;
    cleanArmies();
    if(await checkEnd())return;
    for(const g of S.facs)if(g.alive&&!g.player)storyAI(g);
    await storyTick();
    if(S.imp.length)await dispatches();
    autosave();
  }catch(e){console.error(e);toast('In dieser Saison ist etwas schiefgelaufen: '+e.message);}
  finally{ui.busy=false;setBusy(false);ui.dirtyBase=true;render();}}
async function processPending(){
  const list=S.pending;S.pending=[];
  for(const pr of list){const f=S.facs[pr.from];if(!f.alive)continue;const r=rel(0,f.id);
    if(pr.k==='peace'&&r.war){const v=await ask({art:'scroll',eyebrow:'Gesandter',title:`${f.name} bittet um Frieden`,body:`<p class="flav">Ein Reiter unter weißer Flagge bringt einen Brief mit dem Siegel von ${esc(f.name)}.</p><p>Sie bitten um ein Ende des Krieges. Darauf folgte eine Waffenruhe von vier Jahren.</p>`,buttons:[{label:'Frieden annehmen',value:1,pri:true},{label:'Ablehnen. Der Krieg geht weiter',value:0}]});if(v)makePeace(0,f.id);}
    if(pr.k==='ally'&&!r.war&&!r.ally){const v=await ask({art:'scroll',eyebrow:'Gesandter',title:`${f.name} bietet ein Bündnis an`,body:`<p>Sie schlagen ein geschworenes Bündnis vor. Verbündete werden zu den Kriegen des anderen gerufen.</p>`,buttons:[{label:'Das Bündnis schwören',value:1,pri:true},{label:'Höflich ablehnen',value:0}]});if(v){r.ally=true;log(`Du schwörst ein Bündnis mit ${f.name}.`,'good');}else r.op-=10;}
    if(pr.k==='tribute'&&!r.war){const v=await ask({art:'coin',eyebrow:'Ultimatum',title:`${f.name} fordert Tribut`,body:`<p class="flav">„Zahlt, oder wir holen es uns.“</p><p>Sie fordern 8 Gold pro Saison, 40 Saisons lang (zehn Jahre). Ablehnung bedeutet Krieg.</p>`,buttons:[{label:'Den Tribut zahlen',tip:'-8 Gold pro Saison für 40 Saisons, -10 Ruhm',value:1},{label:'Ablehnen und zum Krieg rüsten',value:0,cls:'war'}]});
      if(v){S.tribs.push({from:0,to:f.id,amt:8,left:40});S.facs[0].prestige-=10;r.op+=20;}else declareWar(f.id,0);}}}

async function checkEnd(){
  const F=FATE[S.facs[0].key],f0=S.facs[0];
  const sb=!!S.sandbox;S.wins=S.wins||{};
  const won=async(k,t)=>{if(!sb){await gameOver(true,t);return true;}if(S.wins[k])return false;S.wins[k]=1;f0.prestige+=50;
    await ask({art:'crown',eyebrow:'Sieg',title:'Ein Ziel ist erreicht',body:`<p class="flav">${esc(t)}</p><p>Im Sandkasten geht die Welt weiter. +50 Ruhm.</p>`,buttons:[{label:'Weiterspielen',value:1,pri:true}]});return false;};
  if(F&&f0.alive&&owned(0).length){if(!sb&&F.lose(f0)){await gameOver(false,F.lt);return true;}if(F.win(f0)&&await won('fate',F.wt))return true;}
  const n=MAP.provs.length,mine=owned(0).length;
  if(!mine||!S.facs[0].alive){await gameOver(false,'Dein letzter Besitz ist gefallen. Deine Banner werden in den Schlamm getreten, und dein Name ist vergessen.');return true;}
  if(mine>=Math.ceil(n*.5)&&await won('half',`Du hältst ${mine} von ${n} Provinzen. Jeder Fürst kniet. Die Aschenkrone gehört dir.`))return true;
  if(S.turn>=320&&!sb){const best=[...S.facs].filter(f=>f.alive).sort((a,b)=>b.prestige-a.prestige)[0];
    await gameOver(best.player,best.player?'Achtzig Jahre sind vergangen. Kein Reich ist ruhmreicher als deines. Die Lieder werden von dir handeln.':`Achtzig Jahre sind vergangen, und ${best.name} ist die ruhmreichste Macht. Dein Reich ist nur eine Fußnote.`);return true;}
  return false;}
async function gameOver(win,text){S.over=true;try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  const v=await ask({art:win?'crown':'skull',eyebrow:win?'Sieg':'Niederlage',title:win?'Das Reich gehört dir':'Das Ende deines Reiches',body:`<p class="flav">${esc(text)}</p><p>Ruhm ${fmt(S.facs[0].prestige)} · ${owned(0).length} Provinzen · ${dateStr()}</p>`,buttons:[{label:'Neues Spiel beginnen',value:1,pri:true},{label:'Karte ansehen',value:0}]});
  render();if(v)intro();}

const SAVE_KEY='ashen-crowns-save-v4';
function serialize(){const o=JSON.parse(JSON.stringify(S));o.log=o.log.slice(0,60);return JSON.stringify(o);}
function encodeSave(){return btoa(unescape(encodeURIComponent(serialize())));}
function loadState(json){const o=JSON.parse(json);if(!o||o.v!==4)throw new Error('Kein Spielstand dieser Version');MAP=generateMap(o.seed,o.mapv||1);
  // restore capital terrain overrides
  if(o.terr)o.terr.forEach((t,i)=>MAP.provs[i].terrain=t);
  S=o;S.imp=S.imp||[];S.provs.forEach((p,i)=>{if(!p.vk)initVillages(i);if(!p.vo)p.vo=p.vk.map(()=>p.owner);});S.facs.forEach(f=>{if(f.home==null)f.home=f.cap;});ui.selProv=null;ui.selArmy=null;ui.dirtyBase=true;ui.ox=null;ui.cam={z:document.body.classList.contains('mob')?2.6:2};sizeCanvas();render();}

  addEventListener('pagehide',()=>autosave());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave();});
  addEventListener('beforeunload',e=>{if(S&&!S.preview&&S.turn>0){autosave();e.preventDefault();e.returnValue='';}});
  if('serviceWorker'in navigator&&location.protocol==='https:'&&window.top===window)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

const FORT_W=[13,15,19,23,27],FORT_H=[11,13,16,19,22];
function fortKey(race,t){const key='fort|'+race+'|'+t;if(SETTLE_GRID[key])return key;
  const W=FORT_W[t-1],H=FORT_H[t-1],g=Array.from({length:H},()=>Array(W).fill('.')),put=(x,y,ch)=>{if(x>=0&&x<W&&y>=0&&y<H)g[y][x]=ch;};
  const wood=race==='orc',Lc=wood?'b':'s',Dc=wood?'B':'S',Ec=wood?'B':'d';
  const block=(x0,w,top,crown)=>{for(let y=top;y<H;y++)for(let x=x0;x<x0+w;x++)put(x,y,x===x0?Dc:x===x0+w-1?Ec:((x*7+y*3)%11===0?Dc:Lc));
    for(let x=x0;x<x0+w;x++){const k=x-x0;if(crown==='spikes'){if(k%2===0)put(x,top-1,Ec);if(k%4===0)put(x,top-2,Ec);}else if(k%2===0)put(x,top-1,Lc);}};
  const crown=race==='undead'||wood?'spikes':'crenels',tw=Math.max(3,Math.round(W*.2)),kw=Math.max(5,Math.round(W*.34))|1;
  const wallTop=Math.round(H*.56),towerTop=Math.round(H*.33)+1,keepTop=3,kx=(W-kw)>>1,mid=kx+(kw>>1);
  block(0,W,wallTop,crown);if(t>=3){block(0,tw,towerTop,crown);block(W-tw,tw,towerTop,crown);}block(kx,kw,keepTop+(t>=4?0:2),crown);
  const win=race==='undead'||race==='dwarf'?'g':'k';
  for(let y=keepTop+3;y<wallTop-1;y+=3)put(mid,y,win);if(t>=3){put(tw>>1,towerTop+2,win);put(W-1-(tw>>1),towerTop+2,win);}
  for(let y=H-3;y<H;y++)for(let x=mid-1;x<=mid+1;x++)put(x,y,'k');put(mid,H-4,'k');
  if(race==='dwarf')for(let x=0;x<W;x++)if(g[wallTop+1][x]!=='.'&&g[wallTop+1][x]!=='k')put(x,wallTop+1,'y');
  if(wood)put(mid,(t>=4?keepTop:keepTop+2)-2,'o');
  if(t>=4){put(mid,1,'b');put(mid,0,'x');put(mid+1,0,'X');}
  if(t>=3&&(race==='human'||race==='wild'))for(const fx of[tw>>1,W-1-(tw>>1)]){put(fx,towerTop-2,'b');put(fx,towerTop-3,'x');put(fx+1,towerTop-3,'X');}
  for(let x=0;x<W;x++)if(g[H-1][x]!=='.'&&g[H-1][x]!=='k')put(x,H-1,Ec);
  SETTLE_GRID[key]=g.map(r=>r.join(''));return key;}

function tutRender(){const box=$('#tut');document.querySelectorAll('.tut-glow').forEach(e=>e.classList.remove('tut-glow'));
  if(!S||!S.tut||S.tut.off||S.over){box.hidden=true;return;}
  let st=TUT[S.tut.i];if(!st){S.tut.off=true;box.hidden=true;return;}
  if(!S.tut.d){S.tut.d=st.start?st.start():{};}
  if(st.done&&st.done(S.tut.d)){S.tut.i++;S.tut.d=null;st=TUT[S.tut.i];if(!st){S.tut.off=true;box.hidden=true;return;}S.tut.d=st.start?st.start():{};}
  box.hidden=false;
  box.innerHTML=`<div class="row"><span class="grow eyebrow">Einführung · Schritt ${S.tut.i+1} von ${TUT.length}</span><button type="button" class="tut-x" id="tutSkip">Überspringen</button></div>
    <h3>${st.t}</h3><p>${st.x()}</p>${st.next?`<div class="btns"><button type="button" class="btn pri" id="tutNext">${st.last?'Los geht’s':'Weiter'}</button></div>`:'<p class="sub">Mach es, und es geht von selbst weiter.</p>'}`;
  if(st.glow){const g=document.querySelector(st.glow);if(g)g.classList.add('tut-glow');}
  const n=box.querySelector('#tutNext');if(n)n.onclick=()=>{S.tut.i++;S.tut.d=null;if(S.tut.i>=TUT.length)S.tut.off=true;tutRender();autosave();};
  box.querySelector('#tutSkip').onclick=()=>{S.tut.off=true;tutRender();autosave();toast('Einführung ausgeblendet. Du kannst sie oben unter „Haus“ neu starten.');};}

function rivalOf(f){if(f.rival!=null&&S.facs[f.rival]&&S.facs[f.rival].alive)return f.rival;const c=MAP.provs[f.cap],d=g=>Math.hypot(MAP.provs[g.cap].lx-c.lx,MAP.provs[g.cap].ly-c.ly);
  const pool=S.facs.filter(g=>g.alive&&g.id!==f.id&&owned(g.id).length);const mins=pool.filter(g=>g.minor).sort((a,b)=>d(a)-d(b)),all=pool.sort((a,b)=>d(a)-d(b));
  const r=(mins[0]&&d(mins[0])<MW*.3?mins[0]:all[0]);f.rival=r?r.id:null;return f.rival;}
function conflict(f){const provs=new Set(),facs=new Set(),st=storyOf(f);
  if(st){const c=STORY[f.key].ch[st.ch];if(c&&(c.g.k==='take'||c.g.k==='win')&&st.p[c.g.m]!=null)provs.add(st.p[c.g.m]);}
  const add=pred=>S.facs.forEach(g=>{if(g.alive&&g.id!==f.id&&pred(g))facs.add(g.id);});
  switch(f.key){case'varric':for(const k of['aubrec','rabenholz']){const h=homeOf(k);if(h>=0&&S.provs[h].owner!==f.id)provs.add(h);}break;
    case'rabenholz':add(g=>!g.minor&&(g.race==='orc'||g.race==='undead'));break;
    case'zehngraeber':add(g=>!g.minor&&g.race==='human');break;
    case'blutfaust':case'aschezahn':add(g=>g.minor);break;}
  if(f.minor){const r=rivalOf(f);if(r!=null)facs.add(r);}
  return{provs,facs};}
function conflictTxt(g){if(g.minor){const r=rivalOf(g);return r!=null?`Fehde mit ${S.facs[r].name}`:'';}
  const st=storyOf(g);if(!st)return'';const c=STORY[g.key].ch[st.ch];return c?(c.g.k==='fate'?'Ziel: '+(FATE[g.key]?FATE[g.key].w.split(':')[0]:''):`Konflikt: ${sFill(g,c.t)}`):'';}
function storyAI(f){const st=storyOf(f);if(!st)return;const D=STORY[f.key];let c=D.ch[st.ch];
  while(c&&c.g.k!=='fate'&&goalDone(f,c.g)){grant(f,c.r||{});st.ch++;log(`${f.name}: ${sFill(f,c.t)} ist vollbracht.`);c=D.ch[st.ch];}}
function storyOf(f){if(!f||!STORY[f.key])return null;if(!f.story){const c=MAP.provs[f.cap];
    const ms=S.facs.filter(g=>g.minor).sort((a,b)=>Math.hypot(MAP.provs[a.cap].lx-c.lx,MAP.provs[a.cap].ly-c.ly)-Math.hypot(MAP.provs[b.cap].lx-c.lx,MAP.provs[b.cap].ly-c.ly));
    let pick2=ms.slice(0,2);if(f.race==='undead'){const liv=ms.find(g=>g.race!=='undead'),dead=ms.find(g=>g.race==='undead'&&g!==liv);pick2=[liv||ms[0],dead||ms.find(g=>g!==liv)].filter(Boolean);}
    const ms2=pick2;f.story={ch:0,m:ms2.map(g=>g.id),p:ms2.map(g=>g.cap),n:ms2.map(g=>g.name),intro:0};}
  return f.story;}
function sFill(f,t){const st=storyOf(f);return t.replace(/\{A\}/g,st.n[0]||'die Nachbarn').replace(/\{B\}/g,st.n[1]||st.n[0]||'die Nachbarn');}
function goalDone(f,g){const st=storyOf(f);let ok=false;
  switch(g.k){case'home':ok=homeDone(f.id);break;
    case'take':ok=st.p[g.m]!=null&&S.provs[st.p[g.m]].owner===f.id;break;
    case'win':{const id=st.m[g.m],r=id!=null?rel(f.id,id):null;ok=st.p[g.m]!=null&&(S.provs[st.p[g.m]].owner===f.id||!!(r&&r.ally&&S.facs[id].alive));break;}
    case'bld':ok=owned(f.id).filter(i=>lvl(S.provs[i],g.b)>0).length>=g.n;break;
    case'lvl':ok=owned(f.id).some(i=>lvl(S.provs[i],g.b)>=g.n);break;
    case'vil':ok=vilCount(f,g.v)>=g.n;break;case'res':ok=f.res[g.r]>=g.n;break;
    case'plunder':ok=(f.plunder||0)>=g.n;break;case'route':ok=routesOf(f.id).length>=g.n;break;}
  return ok&&(!g.and||goalDone(f,g.and));}
function goalTxt(f,g){const st=storyOf(f),nm=i=>st.n[i]||'?';let t='';
  switch(g.k){case'home':t=`Heimatland: ${homeland(f.id).filter(i=>S.provs[i].owner===f.id).length}/${homeland(f.id).length} Provinzen`;break;
    case'take':t=`Erobere ${MAP.provs[st.p[g.m]].name} (${nm(g.m)})`;break;
    case'win':t=`Verbünde dich mit ${nm(g.m)} oder erobere ${MAP.provs[st.p[g.m]].name}`;break;
    case'bld':t=`${bName(g.b,f)}: ${owned(f.id).filter(i=>lvl(S.provs[i],g.b)>0).length}/${g.n}`;break;
    case'lvl':t=`${bName(g.b,f)} auf Stufe ${g.n}`;break;
    case'vil':t=`${VKIND[g.v].n}: ${vilCount(f,g.v)}/${g.n}`;break;case'res':t=`${RES_N[g.r]}: ${fmt(f.res[g.r])}/${fmt(g.n)}`;break;
    case'plunder':t=`Dörfer erobert oder geplündert: ${f.plunder||0}/${g.n}`;break;case'route':t=`Handelsrouten: ${routesOf(f.id).length}/${g.n}`;break;
    case'fate':t=FATE[f.key]?FATE[f.key].w:'';break;}
  return g.and?t+' · '+goalTxt(f,g.and):t;}
function rewardTxt(r){return Object.entries(r).map(([k,v])=>k==='unit'?`eine Kompanie ${uName(v,0)}`:k==='prestige'?`+${v} Ruhm`:`+${v} ${RES_N[k]}`).join(', ');}
function grant(f,r){for(const[k,v]of Object.entries(r)){if(k==='unit'){if(hasUnit(f.race,v))recruitFree(f,v,f.cap);}else if(k==='prestige')f.prestige+=v;else f.res[k]=(f.res[k]||0)+v;}}
async function storyIntro(){const f=S.facs[0],st=storyOf(f);if(!st||st.intro)return;st.intro=1;const D=STORY[f.key],c=D.ch[0];
  await ask({art:'scroll',eyebrow:`${D.n} · Kapitel 1`,title:sFill(f,c.t),body:`<p class="flav">${esc(sFill(f,c.x))}</p><p><b>Ziel:</b> ${esc(goalTxt(f,c.g))}</p><p class="sub">Belohnung: ${esc(rewardTxt(c.r||{}))}. Deine Geschichte findest du jederzeit unter Haus.</p>`,buttons:[{label:'Ans Werk',value:1,pri:true}]});}
async function storyTick(){const f=S.facs[0],st=storyOf(f);if(!st||!f.alive)return;const D=STORY[f.key];
  if(!st.intro){st.intro=1;const c0=D.ch[0];if(!S.sandbox)S.imp.push({m:`${D.n}: ${sFill(f,c0.t)}. ${sFill(f,c0.x)} Ziel: ${goalTxt(f,c0.g)}.`,c:''});}

    log(`Kapitel erfüllt: ${sFill(f,c.t)}.`,'good');

    await ask({art:'scroll',eyebrow:`${D.n} · Kapitel ${st.ch} erfüllt`,title:sFill(f,c.t),body:`<p>Belohnung: <b>${esc(rewardTxt(c.r||{}))}</b></p>${nx?`<h3>Kapitel ${st.ch+1}: ${esc(sFill(f,nx.t))}</h3><p class="flav">${esc(sFill(f,nx.x))}</p><p><b>Ziel:</b> ${esc(goalTxt(f,nx.g))}</p>${nx.r?`<p class="sub">Belohnung: ${esc(rewardTxt(nx.r))}</p>`:''}`:''}`,buttons:[{label:'Weiter',value:1,pri:true}]});
    c=nx;}}
function storySec(){const f=S.facs[0],st=storyOf(f);if(!st)return'';const D=STORY[f.key];
  return`<div class="sec"><h3>Ziele und Konflikte</h3>${S.sandbox?'<p class="sub">Sandkasten: Diese Ziele sind Anregungen. Spiele, wie du willst.</p>':''}${FATE[f.key]?`<p><b>Sieg:</b> ${esc(FATE[f.key].w)}</p>`:''}<p><b>${esc(D.n)}</b></p>${D.ch.map((c,i)=>i<st.ch?`<p class="sub">✓ ${esc(sFill(f,c.t))}</p>`:i===st.ch?`<div class="note"><b>Kapitel ${i+1}: ${esc(sFill(f,c.t))}</b><br>${esc(sFill(f,c.x))}<br><b>Ziel:</b> ${esc(goalTxt(f,c.g))}${c.r?`<br><small>Belohnung: ${esc(rewardTxt(c.r))}</small>`:''}</div>`:'').join('')}</div>`;}
function startGame(key,diff,tut){newGame(key,diff);S.tut=tut?{i:0}:{off:true};ui.selProv=tut?null:S.facs[0].cap;ui.tab='prov';ui.dirtyBase=true;ui.ox=null;ui.cam={z:document.body.classList.contains('mob')?2.6:2};sizeCanvas();render();autosave();}
